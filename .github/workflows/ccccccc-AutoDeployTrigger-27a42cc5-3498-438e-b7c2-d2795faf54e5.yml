name: Trigger auto deployment for ccccccc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ccccccc-AutoDeployTrigger-27a42cc5-3498-438e-b7c2-d2795faf54e5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CCCCCCC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CCCCCCC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CCCCCCC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/Reflow.Api
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CCCCCCC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CCCCCCC_REGISTRY_PASSWORD }}
          containerAppName: ccccccc
          resourceGroup: rg-e6e5
          imageToBuild: ghcr.io/ccccccc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


